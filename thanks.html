<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10252a">
<meta name="robots" content="noindex">
<title>Thank You | AIAS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15272d;--muted:#52666c;--paper:#f7f7f3;--dark:#10252a;--lime:#c8ed9e;--line:#d9e0da;--teal:#34685b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.65 'DM Sans',Arial,sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #598e63;outline-offset:4px}
header{border-bottom:1px solid var(--line);padding:22px max(25px,calc((100vw - 1180px)/2))}
.brand{font:800 25px 'Manrope',Arial,sans-serif;letter-spacing:-.08em}
.brand span{color:var(--teal)}
main{flex:1;display:grid;place-items:center;padding:75px 25px}
.panel{max-width:620px;width:100%}
.icon{height:62px;width:62px;display:grid;place-items:center;background:#e3f1da;border:1px solid #b5d2a5;color:#26523a;font-size:30px;border-radius:8px;margin-bottom:30px}
.eyebrow{color:var(--teal);font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:700}
h1{font:800 clamp(42px,6vw,66px)/1.13 'Manrope',Arial,sans-serif;letter-spacing:-.055em;margin:14px 0 18px}
p{color:var(--muted);font-size:18px;max-width:550px;margin:0 0 28px}
.button{display:inline-flex;align-items:center;justify-content:center;background:var(--dark);color:#fff;padding:14px 22px;border-radius:5px;font-size:14px;font-weight:700}
.button:hover{background:#29443f}
footer{border-top:1px solid var(--line);padding:25px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><a class="brand" href="./" aria-label="AIAS home">AIAS<span>.</span></a></header>
<main><div class="panel"><div class="icon" aria-hidden="true">✓</div><div class="eyebrow">Message received</div><h1>Thank you for reaching out.</h1><p>Your project inquiry has been submitted. We appreciate your interest in AIAS and look forward to learning more about your business.</p><a class="button" href="./">Return to homepage ↗</a></div></main>
<footer>© <span id="year"></span> AIAS / AI Automation Services</footer>
<script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body></html>
